<!-- update.html -->
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Обновить задачу</title>
    <link href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }
        h1 {
            color: #333;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Обновить задачу</h1>
        <form method="post">
            <div class="form-group">
                <label for="task">Описание задачи:</label>
                <input type="text" class="form-control" id="task" name="task" value="{{ task.description }}" required>
            </div>
            <div class="form-check">
                <input type="checkbox" class="form-check-input" id="completed" name="completed" {% if task.completed %}checked{% endif %}>
                <label class="form-check-label" for="completed">Выполнено</label>
            </div>
            <button type="submit" class="btn btn-primary">Сохранить изменения</button>
        </form>
        <a href="{{ url_for('index') }}" class="btn btn-secondary mt-3">Назад к списку задач</a>
    </div>
</body>
</html>
