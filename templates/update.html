<!-- update.html -->
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Обновить задачу</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }
        h1 {
            color: #333;
        }
        form {
            margin-bottom: 20px;
        }
        input[type="text"] {
            padding: 5px;
            width: 300px;
        }
        button {
            padding: 5px 10px;
        }
    </style>
</head>
<body>
    <h1>Обновить задачу</h1>
    <form method="post">
        <input type="text" name="task" value="{{ task.description }}" required>
        <button type="submit">Сохранить изменения</button>
    </form>
    <a href="{{ url_for('index') }}">Назад к списку задач</a>
</body>
</html>
