<!-- templates/update_task.html -->
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Обновить задачу</title>
    <link href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container">
        <h1>Обновить задачу</h1>
        <form method="post">
            <div class="form-group">
                <label for="description">Описание задачи:</label>
                <input type="text" class="form-control" id="description" name="description" value="{{ task.description }}" required>
            </div>
            <div class="form-check">
                <input type="checkbox" class="form-check-input" id="completed" name="completed" {% if task.completed %}checked{% endif %}>
                <label class="form-check-label" for="completed">Выполнено</label>
            </div>
            <button type="submit" class="btn btn-primary">Сохранить изменения</button>
            <a href="{{ url_for('index') }}" class="btn btn-secondary mt-3">Отмена</a>
        </form>
    </div>
</body>
</html>
